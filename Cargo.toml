[package]
name = "esindex_exporter"
version = "0.1.0"
edition = "2021"

authors = [
    "Pit Kleyersburg <pit.kleyersburg@takkt.com>",
    "TAKKT Industrial & Packaging GmbH <webshop-devops@kaiserkraft-europa.de>",
]
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive", "env", "wrap_help"] }
env_logger = "0.11.8"
log = "0.4.28"
prometheus_exporter = { version = "0.8.5", features = ["logging"] }
regex = "1.11.3"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
